[tool.poetry]
name = "ppo-for-beginners"
version = "0.1.0"
description = "PPO implementation for reinforcement learning"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [
    { include = "ppo_for_beginners", from = "." },
    { include = "ppo_for_beginners", from = "part4" },
    { include = "ppo_for_beginners", from = "graph_code" }
]

[tool.poetry.dependencies]
python = "^3.11"
cloudpickle = "^3.0.0"
contourpy = "^1.3.0"
cycler = "^0.12.1"
Farama-Notifications = "^0.0.4"
filelock = "^3.16.1"
fonttools = "^4.54.1"
fsspec = "^2024.9.0"
gymnasium = "^0.29.1"
Jinja2 = "^3.1.4"
kiwisolver = "^1.4.7"
MarkupSafe = "^2.1.5"
matplotlib = "^3.9.2"
mpmath = "^1.3.0"
networkx = "^3.3"
numpy = "^1.26.4"
packaging = "^24.1"
pillow = "^10.4.0"
pygame = "^2.6.1"
pyparsing = "^3.1.4"
python-dateutil = "^2.9.0.post0"
setuptools = "^75.1.0"
six = "^1.16.0"
sympy = "^1.13.3"
torch = "^2.2.2"
torchaudio = "^2.2.2"
torchvision = "^0.17.2"
typing_extensions = "^4.12.2"
wheel = "^0.44.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"


[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=ppo_for_beginners",
    "--cov=.",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=5",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = [".", "ppo_for_beginners", "part4/ppo_for_beginners", "graph_code/ppo_for_beginners"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*.pyc",
    "*/.tox/*",
    "*/site-packages/*",
    "*/graph_data/*",
    "*/conftest.py",
    "setup.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 5
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"